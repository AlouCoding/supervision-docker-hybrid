services:
  nagios:
    image: jasonrivers/nagios:latest
    container_name: nagios
    restart: always
    ports:
      - "8080:80"
    environment:
      - NAGIOSADMIN_USER=nagiosadmin
      - NAGIOSADMIN_PASSWORD=nagiosadmin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - nagios_conf:/opt/nagios/etc
      - nagios_var:/opt/nagios/var
      - ./srvalou.cfg:/opt/nagios/etc/conf.d/srvalou.cfg
      - ./notify.sh:/opt/nagios/etc/notify.sh

  routeur:
    image: alpine:latest
    container_name: routeur
    restart: always
    command: sleep infinity

  srvalou:
    image: ubuntu/bind9:latest
    container_name: srvalou
    restart: always
    environment:
      - TZ=UTC

  clalou:
    image: nginx:alpine
    container_name: clalou
    restart: always

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    restart: always
    ports:
      - "8025:8025"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: blackbox
    restart: always
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: always
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor
    restart: always
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

volumes:
  nagios_conf:
  nagios_var:
  prometheus_data:
  grafana_data:
