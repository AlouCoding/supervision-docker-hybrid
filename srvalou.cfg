define command {
    command_name    notify-host-custom
    command_line    /bin/bash /opt/nagios/etc/notify.sh "$CONTACTEMAIL$" "$NOTIFICATIONTYPE$" "$HOSTALIAS$" "HOST" "$HOSTSTATE$" "$HOSTADDRESS$"
}

define command {
    command_name    notify-service-custom
    command_line    /bin/bash /opt/nagios/etc/notify.sh "$CONTACTEMAIL$" "$NOTIFICATIONTYPE$" "$HOSTALIAS$" "$SERVICEDESC$" "$SERVICESTATE$" "$HOSTADDRESS$"
}

define contact {
    use                             generic-contact
    contact_name                    alou_notif
    alias                           Notifications supervision
    email                           nagios@localhost
    host_notification_commands      notify-host-custom
    service_notification_commands   notify-service-custom
}

define host {
    use                     generic-host
    host_name               routeur
    alias                   Routeur principal
    address                 routeur
    check_command           check-host-alive
    max_check_attempts      2
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_interval   30
    notification_period     24x7
    contacts                alou_notif
    notifications_enabled   1
}

define host {
    use                     generic-host
    host_name               srvalou
    alias                   Serveur DNS
    address                 srvalou
    parents                 routeur
    check_command           check-host-alive
    max_check_attempts      2
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_interval   30
    notification_period     24x7
    contacts                alou_notif
    notifications_enabled   1
}

define host {
    use                     generic-host
    host_name               clalou
    alias                   Poste client
    address                 clalou
    parents                 routeur
    check_command           check-host-alive
    max_check_attempts      2
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_interval   30
    notification_period     24x7
    contacts                alou_notif
    notifications_enabled   1
}

define service {
    use                     generic-service
    host_name               routeur
    service_description     PING Status
    check_command           check_ping!100.0,20%!500.0,60%
    contacts                alou_notif
}

define service {
    use                     generic-service
    host_name               srvalou
    service_description     PING Status
    check_command           check_ping!100.0,20%!500.0,60%
    contacts                alou_notif
}

define service {
    use                     generic-service
    host_name               srvalou
    service_description     DNS_bind9_Port_53
    check_command           check_tcp!53
    contacts                alou_notif
}

define service {
    use                     generic-service
    host_name               clalou
    service_description     PING Status
    check_command           check_ping!100.0,20%!500.0,60%
    contacts                alou_notif
}

define service {
    use                     generic-service
    host_name               clalou
    service_description     HTTP_Service_Port_80
    check_command           check_tcp!80
    contacts                alou_notif
}